<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>j2me-web Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 30px;
      max-width: 1200px;
      width: 100%;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .main-layout {
      display: flex;
      gap: 40px;
      align-items: flex-start;
    }

    .phone-section {
      flex-shrink: 0;
    }

    .info-section {
      flex: 1;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    @media (max-width: 968px) {
      .main-layout {
        flex-direction: column;
        align-items: center;
      }
      
      .info-section {
        width: 100%;
      }
    }

    .phone {
      background: linear-gradient(145deg, #2d2d2d, #1a1a1a);
      border-radius: 22px;
      padding: 18px 14px 14px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), inset 0 2px 5px rgba(255, 255, 255, 0.05);
      position: relative;
      border: 4px solid #0a0a0a;
    }

    .phone::before {
      content: '';
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 4px;
      background: #0a0a0a;
      border-radius: 2px;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    .brand-logo {
      text-align: center;
      color: #555;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      margin-bottom: 10px;
      margin-top: 8px;
      text-transform: uppercase;
      font-family: Arial, sans-serif;
    }

    .screen {
      background: #000;
      border: 3px solid #0a0a0a;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.9);
      margin-bottom: 12px;
    }

    canvas {
      display: block;
      image-rendering: crisp-edges;
      -webkit-font-smoothing: subpixel-antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .keypad {
      margin-top: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .dpad-container {
      display: flex;
      flex-direction: row;
      gap: 1px;
      background: #1a1a1a;
      border-radius: 8px 8px 0 0;
      overflow: hidden;
    }

    .left-keys {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 1px;
    }

    .dpad-wrapper {
      flex: 1;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .right-keys {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 1px;
    }

    .dpad {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 14px 1fr 14px;
      grid-template-rows: 14px 1fr 14px;
      gap: 0;
    }

    .dpad-btn {
      background: linear-gradient(145deg, #3a3a3a, #2a2a2a);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 14px;
      font-weight: bold;
      transition: all 0.15s;
      user-select: none;
      clip-path: polygon(var(--clip));
    }

    .dpad-btn:hover {
      background: linear-gradient(145deg, #4a4a4a, #3a3a3a);
      color: #bbb;
    }

    .dpad-btn:active {
      background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    .dpad-up { 
      grid-column: 1 / 4;
      grid-row: 1;
      --clip: 0 0, 100% 0, 85% 100%, 15% 100%;
    }
    .dpad-down { 
      grid-column: 1 / 4;
      grid-row: 3;
      --clip: 15% 0, 85% 0, 100% 100%, 0 100%;
    }
    .dpad-left { 
      grid-column: 1;
      grid-row: 1 / 4;
      --clip: 0 0, 100% 15%, 100% 85%, 0 100%;
    }
    .dpad-right { 
      grid-column: 3;
      grid-row: 1 / 4;
      --clip: 0 15%, 100% 0, 100% 100%, 0 85%;
    }

    .dpad-center {
      grid-column: 2;
      grid-row: 2;
      background: linear-gradient(145deg, #4a4a4a, #3a3a3a);
      font-size: 16px;
      border: 2px solid #2a2a2a;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .dpad-btn.pressed,
    .soft-key.pressed,
    .call-btn.pressed,
    .hangup-btn.pressed,
    .num-btn.pressed,
    .func-btn.pressed {
      transform: scale(0.95);
      filter: brightness(0.8);
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.8);
    }

    .function-keys {
      display: none;
      flex-direction: row;
      gap: 1px;
      background: #1a1a1a;
    }

    .func-btn {
      width: 100%;
      height: 38px;
      background: linear-gradient(145deg, #3a3a3a, #2a2a2a);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.15s;
      user-select: none;
    }

    .func-btn:hover {
      background: linear-gradient(145deg, #4a4a4a, #3a3a3a);
      color: #bbb;
    }

    .func-btn:active {
      background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
    }



    .soft-key {
      background: linear-gradient(145deg, #3a3a3a, #2a2a2a);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 9px;
      font-weight: 600;
      transition: all 0.15s;
      user-select: none;
    }

    .soft-key:hover {
      background: linear-gradient(145deg, #4a4a4a, #3a3a3a);
      color: #bbb;
    }

    .soft-key:active {
      background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    .call-btn {
      background: linear-gradient(145deg, #2d7a2d, #1d5a1d);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 20px;
      transition: all 0.15s;
      user-select: none;
    }

    .call-btn:hover {
      background: linear-gradient(145deg, #3d8a3d, #2d6a2d);
    }

    .call-btn:active {
      background: linear-gradient(145deg, #1d5a1d, #0d4a0d);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    .hangup-btn {
      background: linear-gradient(145deg, #c93a3a, #a92a2a);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 20px;
      transition: all 0.15s;
      user-select: none;
    }

    .hangup-btn:hover {
      background: linear-gradient(145deg, #d94a4a, #b93a3a);
    }

    .hangup-btn:active {
      background: linear-gradient(145deg, #a92a2a, #892a2a);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    .left-keys .soft-key {
      flex: 1;
    }

    .left-keys .call-btn {
      flex: 1;
    }

    .right-keys .soft-key {
      flex: 1;
    }

    .right-keys .hangup-btn {
      flex: 1;
    }

    .number-pad {
      display: flex;
      flex-direction: column;
      gap: 1px;
      padding: 0;
      background: #1a1a1a;
      border-radius: 0 0 8px 8px;
      overflow: hidden;
    }

    .number-row {
      display: flex;
      flex-direction: row;
      gap: 1px;
      height: 50px;
    }

    .number-row:last-child .num-btn:first-child {
      border-radius: 0 0 0 8px;
    }

    .number-row:last-child .num-btn:last-child {
      border-radius: 0 0 8px 0;
    }

    .num-btn {
      flex: 1;
      height: 50px;
      background: linear-gradient(145deg, #3a3a3a, #2a2a2a);
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ddd;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.15s;
      user-select: none;
      position: relative;
    }

    .num-btn:hover {
      background: linear-gradient(145deg, #4a4a4a, #3a3a3a);
    }

    .num-btn:active {
      background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    .num-btn .letters {
      font-size: 8px;
      color: #888;
      margin-top: 1px;
      letter-spacing: 0.5px;
      font-weight: 400;
    }

    .info-card {
      padding: 16px;
      background: #f8f9fa;
      border-radius: 12px;
      border: 1px solid #e9ecef;
    }

    .info-card h3 {
      color: #333;
      margin-bottom: 12px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .info-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid #e9ecef;
    }

    .info-item:last-child {
      border-bottom: none;
    }

    .info-label {
      font-weight: 600;
      color: #555;
      font-size: 14px;
    }

    .info-value {
      color: #667eea;
      font-family: 'Courier New', monospace;
      font-size: 13px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: #667eea;
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      flex: 1 1 auto;
      min-width: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:hover:not(:disabled) {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
      opacity: 0.6;
    }

    .keyboard-hint {
      padding: 12px;
      background: #fff3cd;
      border-left: 4px solid #ffc107;
      border-radius: 6px;
      font-size: 11px;
      color: #856404;
    }

    .keyboard-hint strong {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .key-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .key-item {
      background: white;
      padding: 4px 10px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .key-item::before {
      content: '▸';
      color: #ffc107;
      font-weight: bold;
    }

    #status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }

    #status:not(:empty) {
      display: block;
    }

    #status.loading {
      background: #cce5ff;
      color: #004085;
      border-left: 3px solid #0066cc;
    }

    #status.success {
      background: #d4edda;
      color: #155724;
      border-left: 3px solid #28a745;
    }

    #status.error {
      background: #f8d7da;
      color: #721c24;
      border-left: 3px solid #dc3545;
    }

    .fullscreen-quick-slots {
      position: fixed;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2100;
      display: none;
      grid-template-columns: repeat(2, 42px);
      gap: 6px;
      padding: 8px;
      border-radius: 8px 0 0 8px;
      background: rgba(0, 0, 0, 0.54);
      backdrop-filter: blur(8px);
    }

    body:has(:fullscreen) .fullscreen-quick-slots {
      display: grid;
    }

    .fullscreen-quick-slots button {
      width: 42px;
      height: 34px;
      min-width: 0;
      padding: 0;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #fff;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
    }

    .fullscreen-quick-slots button:hover {
      background: rgba(255, 255, 255, 0.28);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 J2ME 模拟器演示</h1>
    <p class="subtitle">基于 j2me-web 的浏览器 J2ME 运行环境</p>

    <div class="main-layout">
      <div class="phone-section">
        <div class="phone">
          <div class="brand-logo">J2ME Phone</div>
          <div class="screen">
            <canvas id="game-canvas" width="240" height="320"></canvas>
          </div>
          
          <div class="keypad">
            <div class="dpad-container">
              <div class="left-keys">
                <div class="soft-key" data-key="Escape">菜单</div>
                <div class="call-btn" data-key="c" title="拨号">📞</div>
              </div>
              
              <div class="dpad-wrapper">
                <div class="dpad">
                  <div class="dpad-btn dpad-up" data-key="ArrowUp">▲</div>
                  <div class="dpad-btn dpad-down" data-key="ArrowDown">▼</div>
                  <div class="dpad-btn dpad-left" data-key="ArrowLeft">◀</div>
                  <div class="dpad-btn dpad-right" data-key="ArrowRight">▶</div>
                  <div class="dpad-btn dpad-center" data-key="Enter">OK</div>
                </div>
              </div>
              
              <div class="right-keys">
                <div class="soft-key" data-key="Backspace">返回</div>
                <div class="hangup-btn" data-key="h" title="挂断">📵</div>
              </div>
            </div>

            <div class="function-keys">
              <div class="func-btn" data-key=" ">选择</div>
            </div>

            <div class="number-pad">
              <div class="number-row">
                <div class="num-btn" data-key="1">
                  <span>1</span>
                </div>
                <div class="num-btn" data-key="2">
                  <span>2</span>
                  <span class="letters">ABC</span>
                </div>
                <div class="num-btn" data-key="3">
                  <span>3</span>
                  <span class="letters">DEF</span>
                </div>
              </div>
              <div class="number-row">
                <div class="num-btn" data-key="4">
                  <span>4</span>
                  <span class="letters">GHI</span>
                </div>
                <div class="num-btn" data-key="5">
                  <span>5</span>
                  <span class="letters">JKL</span>
                </div>
                <div class="num-btn" data-key="6">
                  <span>6</span>
                  <span class="letters">MNO</span>
                </div>
              </div>
              <div class="number-row">
                <div class="num-btn" data-key="7">
                  <span>7</span>
                  <span class="letters">PQRS</span>
                </div>
                <div class="num-btn" data-key="8">
                  <span>8</span>
                  <span class="letters">TUV</span>
                </div>
                <div class="num-btn" data-key="9">
                  <span>9</span>
                  <span class="letters">WXYZ</span>
                </div>
              </div>
              <div class="number-row">
                <div class="num-btn" data-key="*">
                  <span>*</span>
                </div>
                <div class="num-btn" data-key="0">
                  <span>0</span>
                  <span class="letters">+</span>
                </div>
                <div class="num-btn" data-key="#">
                  <span>#</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="info-section">
        <div class="info-card" style="padding: 12px;">
          <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 12px;">
            <div style="display: flex; align-items: center; gap: 4px;">
              <span style="color: #888;">📱</span>
              <span style="color: #666;">240×320</span>
            </div>
            <div style="display: flex; align-items: center; gap: 4px;">
              <span style="color: #888;">⚙️</span>
              <span style="color: #666;">CLDC 1.1 / MIDP 2.0</span>
            </div>
            <div style="display: flex; align-items: center; gap: 4px;">
              <span style="color: #888;">●</span>
              <span style="color: #667eea; font-weight: 600;" id="vm-status">未启动</span>
            </div>
          </div>
        </div>

        <div class="info-card">
          <h3>🎮 控制面板</h3>
          <div class="controls">
            <button id="pause-btn" disabled>⏸️ 暂停</button>
            <button id="screenshot-btn" disabled>📷 截图</button>
            <button id="fullscreen-btn" disabled>⛶ 全屏</button>

          </div>
          <div class="controls" style="margin-top: 8px; align-items: center;">
            <label style="font-size: 12px; white-space: nowrap;">🚀 变速</label>
            <input type="range" id="speed-slider" min="0.5" max="10" step="0.5" value="1" disabled style="flex: 1; min-width: 100px;">
            <span id="speed-label" style="font-size: 12px; min-width: 36px; text-align: center;">1x</span>
            <button id="fps-btn" disabled>📊 FPS</button>
          </div>
          <label class="controls" style="margin-top: 8px; align-items: center; font-size: 12px; color: #666; cursor: pointer;">
            <input type="checkbox" id="music-follow-speed-toggle" disabled>
            <span>声音跟随变速</span>
          </label>
          <div class="controls" style="margin-top: 8px;">
            <button id="save-slot-1" disabled>💾 存1</button>
            <button id="load-slot-1" disabled>📂 读1</button>
            <button id="save-slot-2" disabled>💾 存2</button>
            <button id="load-slot-2" disabled>📂 读2</button>
            <button id="save-slot-3" disabled>💾 存3</button>
            <button id="load-slot-3" disabled>📂 读3</button>
          </div>
          <div class="controls" style="margin-top: 8px;">
            <button id="cheat-toggle-btn" disabled>🔬 内存搜索</button>
          </div>
          <div id="status"></div>
        </div>

        <div class="info-card" id="cheat-panel" style="display:none;">
          <h3>🔬 内存搜索器</h3>

          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center;">
            <select id="cheat-mode" style="padding:6px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;flex:0 0 auto;">
              <option value="0">等于</option>
              <option value="7">快照（建立基准）</option>
              <option value="3">增大了</option>
              <option value="4">减小了</option>
              <option value="1">有变化</option>
              <option value="2">无变化</option>
              <option value="5">增大了…</option>
              <option value="6">减小了…</option>
            </select>
            <input id="cheat-value" type="number" placeholder="输入数值" style="flex:1;min-width:80px;padding:6px 8px;border:1px solid #ddd;border-radius:6px;font-size:13px;" />
            <button id="cheat-search-btn" style="flex:0 0 auto;min-width:auto;padding:6px 12px;background:#667eea;">首次搜索</button>
            <button id="cheat-refine-btn" style="flex:0 0 auto;min-width:auto;padding:6px 12px;background:#764ba2;" disabled>再次过滤</button>
            <button id="cheat-clear-btn" style="flex:0 0 auto;min-width:auto;padding:6px 12px;background:#868e96;">清空</button>
          </div>

          <div id="cheat-status" style="font-size:12px;color:#888;margin-bottom:8px;min-height:18px;"></div>

          <div id="cheat-results" style="max-height:180px;overflow-y:auto;border:1px solid #e9ecef;border-radius:6px;background:#fff;"></div>

          <div style="margin-top:10px;">
            <div style="font-size:13px;font-weight:600;color:#555;margin-bottom:6px;">冻结列表</div>
            <div id="cheat-freeze-list" style="max-height:140px;overflow-y:auto;border:1px solid #e9ecef;border-radius:6px;background:#fff;"></div>
          </div>

          <div style="margin-top:10px;border-top:1px solid #e9ecef;padding-top:10px;">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
              <span style="font-size:13px;font-weight:600;color:#555;flex:1;">📌 稳定金手指</span>
